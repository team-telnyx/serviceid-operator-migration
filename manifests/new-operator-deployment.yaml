apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-oci-serviceid-operator
  namespace: op-service-id-system
  labels:
    app: infra-oci-serviceid-operator
    squad: infra-core-squad
    app.telnyx.com/managed-by: infra-core-squad
    app.telnyx.com/name: infra-oci-serviceid-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-oci-serviceid-operator
  template:
    metadata:
      labels:
        app: infra-oci-serviceid-operator
        squad: infra-core-squad
      annotations:
        # Telnyx required annotations
        app.telnyx.com/managed-by: infra-core-squad
        app.telnyx.com/name: infra-oci-serviceid-operator
        # Vault Agent Injector configuration
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-run-as-user: "1001"
        vault.hashicorp.com/auth-path: auth/tlnx-backend-lv1-dev
        vault.hashicorp.com/role: op-service-id
        vault.hashicorp.com/service: https://vault.query.dev.telnyx.io
    spec:
      serviceAccountName: op-service-id-controller-manager
      automountServiceAccountToken: true
      containers:
        - name: manager
          # NOTE: This image requires a code fix to read Vault token from file
          # See: docs/vault-token-issue.md for details
          image: registry.internal.telnyx.com/jenkins/infra-oci-serviceid-operator:infra-14150-nil-pointer-dereference-in-vault-client-05027d3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: CLUSTER_NAME
              value: tlnx-backend-lv1-dev
            - name: ENV
              value: dev
            - name: LOG_LEVEL
              value: debug
            # Vault configuration
            - name: VAULT_ADDR
              value: "https://vault.query.dev.telnyx.io"
            - name: VAULT_K8S_AUTH_PATH
              value: "auth/tlnx-backend-lv1-dev"
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
